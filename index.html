    <p id="msgErreur" style="color:red;"></p>
</div>

<div id="pagePrincipale" class="cacher">

    <div class="bloc">

        <button onclick="ajouterCode()" style="background:#28a745;">Ajouter</button>
        <p id="msgAjout"></p>
    </div>

       <div class="bloc" id="blocAdmin" style="border:2px dashed #ff9800;">

    <div class="bloc">

  <div class="ligne-outils">

            <select id="selectSectionNav" style="flex:1;"></select>
            <button onclick="allerSection()" style="background:#6f42c1;">Aller</button>

    </div>

    <!-- BLOC 2 : RECHERCHER UN AGENT -->

        <h2>Rechercher un Agent</h2>

        <div id="resultatRecherche"></div>
    </div>
</div>

    <h2>Pointage du <span id="titreDate"></span></h2>

        <div id="totalMangeGeneral">TOTAL ONT MANGÉ: 0</div>
        <div id="totalRestantGeneral">TOTAL RESTANT: 0</div>
    </div>
    <div id="conteneurSections"></div>
</div>

const sections = ["ADMINISTRATION", "DPM GROS SALLE", "MAGASIN NOIX BRUTE", "QUALITE NOIX BRUTE", "CALLIBRAGE", "CALLIBRAGE CARISTE", "CHAUDIERE", "COQUE","COQUE CHAUFFEUR", "LAVAGE EQUIPEMENT", "CUISSON", "CUISSON CARISTE","DECO HOMME", "DECO FEMME", "QUALITE DECO", "ENTRETIEN DECO", "SCOOPING","SCOOPING CORRECTION", "ETUVAGE", "GESTIONNAIRE/MAGASIN PIECES DE RECHANGE", "MAINTENANCE", "CONTROLEUR FOUR","DP AUTO", "CONCASSAGE","CLASS MANUEL", "CLASS AUTO","EMBALLAGE 1", "EMBALLAGE 2", "ENTRETIEN EMBALLAGE", "MAGASIN PRODUIT FINIS", "DPM Elèves", "Niamatogola", "DPM CORRECTRISES", "ENTRETIEN DPM", "ENTRETIEN ZONE BLANCHE", "ENTRETIEN ADMINISTRATION", "OPERATEUR PESEE", "SECTION HYGIENE", "BUANDERIE", "ENTRETIEN", "ENTRETIEN ZONE NON BATI", "CANTINE", "DISTRI.PROD MAN", "ELEVES GARCONS"];

let jourActuel = new Date().toISOString().split('T')[0];
let sectionBloquee = "";
let allData = {};

window.onload = async function() {
    let selectAjout = document.getElementById('sectionAjout');
    let selectNav = document.getElementById('selectSectionNav');
    sections.forEach(s => {
        selectAjout.innerHTML += `<option value="${s}">${s}</option>`;
        selectNav.innerHTML += `<option value="${s}">${s}</option>`;
    });
    document.getElementById('selectDate').value = jourActuel;
    await chargerJour();
    ecouterChangements();
}

async function chargerJour() {
    jourActuel = document.getElementById('selectDate').value;
    sectionBloquee = "";
    const { data, error } = await supabase.from('pointages').select('*').eq('date_pointage', jourActuel);
    if(error) return alert("Erreur: " + error.message);
    allData = {};
    sections.forEach(s => allData[s] = []);
    data.forEach(row => { if(allData[row.section]) allData[row.section].push(row); });
    afficher();
}

function ecouterChangements() {
    supabase.channel('pointages').on('postgres_changes', { event: '*', schema: 'public', table: 'pointages' },
        payload => { if(payload.new.date_pointage === jourActuel){ chargerJour(); } }
    ).subscribe();
}

async function ajouterCode() {
    let code = document.getElementById('codeAjout').value.trim().toUpperCase();
    let section = document.getElementById('sectionAjout').value;
    if(!code) return alert("Tapez un code");
    const { error } = await supabase.from('pointages').insert({date_pointage: jourActuel, section: section, code: code, nom: '', mange: false});
    if(error && error.code === '23505'){ document.getElementById('msgAjout').innerHTML = `<span style="color:red;">❌ Code ${code} existe déjà</span>`;
    } else { document.getElementById('msgAjout').innerHTML = `<span style="color:green;">✅ Code ${code} ajouté</span>`; document.getElementById('codeAjout').value = ''; }
}

async function verifierCode() {
    let code = document.getElementById('codeVerif').value.trim().toUpperCase();
    let msgVerif = document.getElementById('msgVerif');
    if(!code) return alert("Tapez un code");
    const { data: agent } = await supabase.from('pointages').select('*').eq('date_pointage', jourActuel).eq('code', code).single();
    if(agent) {
        if(agent.mange === false) {
            await supabase.from('pointages').update({mange: true}).eq('id', agent.id);
            msgVerif.innerHTML = `<span style="color:green;"><b>${code}</b> trouvé dans <b>${agent.section}</b><br>✅ PRÉSENT<br>🍽️ DROIT A 1 PLAT</span>`;
        } else { msgVerif.innerHTML = `<span style="color:red;"><b>${code}</b> trouvé dans <b>${agent.section}</b><br>❌ A DÉJÀ PRIS</span>`; }
        sectionBloquee = agent.section; afficherUneSection(agent.section);
    } else { msgVerif.innerHTML = `<span style="color:red;">❌ Code ${code} non trouvé</span>`; }
    document.getElementById('codeVerif').value = '';
}

async function ajouterAdmin() {
    let nom = document.getElementById('nomAdmin').value.trim();
    if(!nom) return alert("Tapez un nom");
    let numero = allData["ADMINISTRATION"]? allData["ADMINISTRATION"].length + 1 : 1;
    let codeAdmin = "ADM-" + numero;
    await supabase.from('pointages').insert({date_pointage: jourActuel, section: "ADMINISTRATION", code: codeAdmin, nom: nom, mange: false});
    document.getElementById('msgAdmin').innerHTML = `<span style="color:green;">✅ ${nom} ajouté ${codeAdmin}</span>`;
    document.getElementById('nomAdmin').value = '';
}

        document.getElementById('pageLogin').classList.add('cacher');
        document.getElementById('pagePrincipale').classList.remove('cacher');
        document.getElementById('selectDate').value = jourActuel;
        nouveauJour();
    } else {
        document.getElementById('msgErreur').innerText = "Code incorrect!";
    }
}

function nouveauJour() {
    if(!allData[jourActuel]) {
        allData[jourActuel] = {};
        sections.forEach(s => allData[jourActuel][s] = []);
        sauvegarder();
    }
    afficher();
}

function chargerJour() {
    jourActuel = document.getElementById('selectDate').value;
    sectionBloquee = "";
    afficher();
}

function sauvegarder() {
    localStorage.setItem('registresPointage', JSON.stringify(allData));
}

function afficher() {
    document.getElementById('titreDate').innerText = jourActuel;
    let dataJour = allData[jourActuel] || {};

    if(sectionBloquee!== "" && dataJour[sectionBloquee]){
        afficherUneSection(sectionBloquee, dataJour[sectionBloquee]);
        return;
    }

    let html = '';
    let totalGeneralEnregistres = 0;
    let totalGeneralMange = 0;
    let totalGeneralRestant = 0; // NOUVEAU

    sections.forEach(section => {
        let agents = dataJour[section] || [];
        let totalEnregistres = agents.length;
        let totalMange = agents.filter(a => a.mange).length;
        let totalRestant = totalEnregistres - totalMange; // NOUVEAU

        totalGeneralEnregistres += totalEnregistres;
        totalGeneralMange += totalMange;
        totalGeneralRestant += totalRestant; // NOUVEAU

        // AJOUT DU TOTAL RESTANT ICI
        html += `<div class="section-bloc">
            <h3>${section}
                <span style="font-size:14px; color:blue;">Enregistrés: ${totalEnregistres}</span> |
                <span style="font-size:14px; color:green;">Ont mangé: ${totalMange}</span> |
                <span style="font-size:14px; color:red;">Restant: ${totalRestant}</span> <!-- NOUVEAU -->
            </h3>
            <ul>`;
        html += agents.map(a => {
            let codeAffiche = cacheActif? "******" : a.code;
            return `<li>${codeAffiche} - ${a.nom || ''} <span class="${a.mange? 'mange' : 'present'}">${a.mange? '🍽️ MANGÉ' : '✅ PRÉSENT'}</span> <button onclick="supprimerCode('${section}', '${a.code}')" style="background:red; padding:2px 5px; font-size:10px; float:right;">X</button></li>`;
        }).join('');
        html += `</ul></div>`;
    });

    // MISE A JOUR DES 3 TOTAUX GENERAUX
    document.getElementById('totalEnregistres').innerText = `TOTAL ENREGISTRÉS AUJOURD'HUI: ${totalGeneralEnregistres}`;
    document.getElementById('totalMangeGeneral').innerText = `TOTAL ONT MANGÉ AUJOURD'HUI: ${totalGeneralMange}`;
    document.getElementById('totalRestantGeneral').innerText = `TOTAL RESTANT AUJOURD'HUI: ${totalGeneralRestant}`; // NOUVEAU

    document.getElementById('conteneurSections').innerHTML = html;
}

async function supprimerCode(id) { await supabase.from('pointages').delete().eq('id', id); }
async function resetJour() { if(confirm("Supprimer la journée?")) { await supabase.from('pointages').delete().eq('date_pointage', jourActuel); }}
function allerSection() { let s = document.getElementById('selectSectionNav').value; sectionBloquee=s; afficherUneSection(s); }
function rechercherAgent() { /* ta fonction */ }
function toggleCache() { cacheActif=!cacheActif; afficher(); }
function handleSecretCode() { /* ta fonction */ }
</script>
