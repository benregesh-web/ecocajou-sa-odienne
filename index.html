<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registre de Pointage - Ecocajou</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="pageLogin" class="bloc">
    <h2>Connexion Cantine Ecocajou</h2>
    <input type="password" id="codeAcces" placeholder="Tapez le code d'accès">
    <button onclick="verifierAcces()" class="btn-bleu">Entrer</button>
    <p id="msgErreur" style="color:red;"></p>
</div>

<div id="pagePrincipale" class="cacher">
    <div class="bloc">
        <button onclick="deconnexion()" class="btn-rouge" style="float:right;">Déconnexion</button>
        <h2>GESTION CANTINE - ECOCAJOU SA ODIENNE</h2>
        <label>Choisir Date: </label>
        <input type="date" id="selectDate">
        <button onclick="chargerJour()" class="btn-cyan">Charger ce jour</button>
        <button onclick="nouveauJour()" class="btn-bleu">+ Nouveau Jour</button>
        
        <div class="nav-bar">
            <select id="navSections" onchange="allerAlaSection()">
                <option value="">-- Aller à une Section --</option>
            </select>
            <button onclick="toggleCache()" id="btnCache" class="btn-gris">👁️ Cacher Codes</button>
        </div>

        <button onclick="window.print()" class="btn-jaune">🖨️ Imprimer</button>
        <button onclick="resetJour()" class="btn-rouge">🗑️ Tout Réinitialiser</button>
        <button onclick="imprimerSection()" class="btn-violet">IMPRIMER LISTE</button>
    </div>

    <div class="bloc">
        <h2>Ajouter un Code</h2>
        <input type="text" id="codeAjout" placeholder="Code Agent">
        <select id="sectionAjout"></select>
        <button onclick="ajouterCode()" class="btn-vert">Ajouter</button>
        <p id="msgAjout"></p>
    </div>

    <div class="bloc">
        <h2>Vérifier un Code</h2>
        <input type="text" id="codeVerif" placeholder="Code Agent">
        <button onclick="verifierCode()" class="btn-cyan">Vérifier</button>
        <p id="msgVerif"></p>
    </div>

    <h2>Pointage du <span id="titreDate"></span></h2>
    <div class="totaux">
        <div id="totalEnregistres">TOTAL ENREGISTRÉS: 0</div>
        <div id="totalMangeGeneral">TOTAL ONT MANGÉ: 0</div>
    </div>
    <div id="conteneurSections">Chargement...</div>
</div>

<script type="module">
    // 1. IMPORT FIREBASE
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, get, child, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // 2. TA CONFIG FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyBo-B3d8LCfHnhf5TQDUOywKy6Wm496bsc",
      authDomain: "ecocajou-cantine.firebaseapp.com",
      databaseURL: "https://ecocajou-cantine-default-rtdb.firebaseio.com",
      projectId: "ecocajou-cantine",
      storageBucket: "ecocajou-cantine.firebasestorage.app",
      messagingSenderId: "931873154005",
      appId: "1:931873154005:web:8b96f6b7bfb7b87374535c"
    };

    // 3. INITIALISER
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db);

    const CODE_SECRET = "BEN2026";
    const CODE_RESET = "RESET2026";
    const CODE_VOIR = "VOIR2026";
    let cacheActif = false;

    const sections = [
        "MAGASIN NOIX BRUTE", "QUALITE NOIX BRUTE", "CALLIBRAGE", "CALLIBRAGE CARISTE", "CHAUDIERE", "COQUE","COQUE CHAUFFEUR",
        "LAVAGE EQUIPEMENT","CUISSON", "CUISSON CARISTE","DECO HOMME", "DECO FEMME", "QUALITE DECO", "ENTRETIEN DECO", "SCOOPING","SCOOPING CORRECTION",
        "ETUVAGE", "GESTIONNAIRE/MAGASIN PIECES DE RECHANGE", "MAINTENANCE", "CONTROLEUR FOUR","DP AUTO", "CONCASSAGE","CLASS MANUEL", "CLASS AUTO","EMBALLAGE 1",
        "EMBALLAGE 2", "ENTRETIEN EMBALLAGE", "MAGASIN PRODUIT FINIS", "DPM GROS SALLE","DPM Elèves", "Niamatogola","DPM CORRECTRISES", "ENTRETIEN DPM",
        "ENTRETIEN ZONE BLANCHE", "ENTRETIEN ADMINISTRATION", "OPERATEUR PESEE", "SECTION HYGIENE", "BUANDERIE", "ENTRETIEN", "ENTRETIEN ZONE NON BATI",
        "CANTINE", "DISTRI.PROD MAN", "ADMINISTRATION", "ELEVES GARCONS"
    ];

    let allData = {};
    let jourActuel = new Date().toISOString().split('T')[0];
    let sectionBloquee = "";

    // REMPLIR LES SELECTS
    window.onload = function() {
        let selectAjout = document.getElementById('sectionAjout');
        let selectNav = document.getElementById('navSections');
        sections.forEach(s => {
            let opt1 = document.createElement('option'); opt1.value = s; opt1.textContent = s; selectAjout.appendChild(opt1);
            let opt2 = document.createElement('option'); opt2.value = s; opt2.textContent = s; selectNav.appendChild(opt2);
        });
    }

    window.allerAlaSection = function() {
        let section = document.getElementById('navSections').value;
        if(section) {
            document.getElementById(section.replace(/\s+/g, '-')).scrollIntoView({behavior: 'smooth'});
            document.getElementById('navSections').value = "";
        }
    }

    window.verifierAcces = function() {
        let code = document.getElementById('codeAcces').value;
        if(code === CODE_SECRET) {
            document.getElementById('pageLogin').classList.add('cacher');
            document.getElementById('pagePrincipale').classList.remove('cacher');
            document.getElementById('selectDate').value = jourActuel;
            nouveauJour();
        } else { document.getElementById('msgErreur').innerText = "Code incorrect!"; }
    }

    window.nouveauJour = async function() {
        const snapshot = await get(child(dbRef, `registres/${jourActuel}`));
        if (!snapshot.exists()) {
            let nouveau = {};
            sections.forEach(s => nouveau[s] = []);
            await set(ref(db, `registres/${jourActuel}`), nouveau);
        }
        chargerJour();
    }

    window.chargerJour = async function() {
        jourActuel = document.getElementById('selectDate').value;
        sectionBloquee = "";
        const snapshot = await get(child(dbRef, `registres/${jourActuel}`));
        allData[jourActuel] = snapshot.val() || {};
        afficher();
    }

    async function sauvegarder() {
        await set(ref(db, `registres/${jourActuel}`), allData[jourActuel]);
    }

    function afficher() {
        document.getElementById('titreDate').innerText = jourActuel;
        let dataJour = allData[jourActuel] || {};

        if(sectionBloquee!== "" && dataJour[sectionBloquee]){
            afficherUneSection(sectionBloquee, dataJour[sectionBloquee]);
            return;
        }

        let html = '';
        let totalGeneralEnregistres = 0;
        let totalGeneralMange = 0;

        sections.forEach(section => {
            let agents = dataJour[section] || [];
            let totalEnregistres = agents.length;
            let totalMange = agents.filter(a => a.mange).length;
            totalGeneralEnregistres += totalEnregistres;
            totalGeneralMange += totalMange;
            let idSection = section.replace(/\s+/g, '-');

            html += `<div class="section-bloc" id="${idSection}">
                <h3>${section} <span style="font-size:12px;">(${totalEnregistres})</span> | <span style="color:green;">Mangé: ${totalMange}</span></h3>
                <ul>`;
            html += agents.map(a => {
                let codeAffiche = cacheActif? "******" : a.code;
                return `<li>${codeAffiche} <span class="${a.mange? 'mange' : 'present'}">${a.mange? 'MANGÉ' : 'PRÉSENT'}</span>
                <button onclick="supprimerCode('${section}', '${a.code}')">X</button></li>`;
            }).join('');
            html += `</ul></div>`;
        });

        document.getElementById('totalEnregistres').innerText = `TOTAL ENREGISTRÉS: ${totalGeneralEnregistres}`;
        document.getElementById('totalMangeGeneral').innerText = `TOTAL ONT MANGÉ: ${totalGeneralMange}`;
        document.getElementById('conteneurSections').innerHTML = html;
    }

    window.ajouterCode = async function() {
        let code = document.getElementById('codeAjout').value.trim().toUpperCase();
        let section = document.getElementById('sectionAjout').value;
        if(!code) return alert("Tapez un code");
        let dejaExiste = false;
        for(let s in allData[jourActuel]) {
            if(allData[jourActuel][s].find(a => a.code === code)) { dejaExiste = true; break; }
        }
        if(dejaExiste) { document.getElementById('msgAjout').innerHTML = `<span style="color:red;">❌ Le code ${code} existe déjà</span>`; return; }
        
        allData[jourActuel][section].push({code: code, nom: '', mange: false});
        await sauvegarder();
        document.getElementById('msgAjout').innerHTML = `<span style="color:green;">✅ Code ${code} ajouté</span>`;
        document.getElementById('codeAjout').value = '';
        afficher();
    }

    window.verifierCode = async function() {
        let code = document.getElementById('codeVerif').value.trim().toUpperCase();
        let msgVerif = document.getElementById('msgVerif');
        if(!code) return alert("Tapez un code");
        let trouve = false; let sectionTrouvee = ""; let agentTrouve = null;
        for(let s in allData[jourActuel]) {
            let agent = allData[jourActuel][s].find(a => a.code === code);
            if(agent) { trouve = true; agentTrouve = agent; sectionTrouvee = s; break; }
        }
        if(trouve) {
            if(agentTrouve.mange === false) {
                agentTrouve.mange = true;
                msgVerif.innerHTML = `<span style="color:green;"><b>${code}</b> dans <b>${sectionTrouvee}</b><br>✅ PRÉSENT<br>🍽️ IL A DROIT A 1 PLAT</span>`;
            } else {
                msgVerif.innerHTML = `<span style="color:red;"><b>${code}</b> dans <b>${sectionTrouvee}</b><br>❌ A DÉJÀ PRIS SON PLAT</span>`;
            }
            await sauvegarder();
            sectionBloquee = sectionTrouvee;
            afficherUneSection(sectionBloquee, allData[jourActuel][sectionBloquee]);
            document.getElementById('codeVerif').value = '';
        } else {
            msgVerif.innerHTML = `<span style="color:red;">❌ Code ${code} non trouvé</span>`;
            document.getElementById('codeVerif').value = '';
        }
    }

    function afficherUneSection(nomSection, agents) {
        let totalMange = agents.filter(a => a.mange).length;
        let html = `<div class="section-bloc">
            <h3>${nomSection} <span style="font-size:12px;">(${agents.length})</span> | <span style="color:green;">Mangé: ${totalMange}</span></h3>
            <ul>`;
        html += agents.map(a => {
            let codeAffiche = cacheActif? "******" : a.code;
            return `<li>${codeAffiche} <span class="${a.mange? 'mange' : 'present'}">${a.mange? 'MANGÉ' : 'PRÉSENT'}</span></li>`;
        }).join('');
        html += `</ul></div>`;
        html += `<button onclick="sectionBloquee=''; afficher();" class="btn-jaune" style="color:#000;">VOIR TOUTES SECTIONS</button>`;
        document.getElementById('conteneurSections').innerHTML = html;
    }

    window.supprimerCode = async function(section, code) {
        if(confirm(`Supprimer le code ${code}?`)) {
            allData[jourActuel][section] = allData[jourActuel][section].filter(a => a.code!== code);
            await sauvegarder(); afficher();
        }
    }

    window.resetJour = async function() {
        let code = prompt("Tapez le Code RESET:");
        if(code!== CODE_RESET) { alert("❌ Code incorrect!"); return; }
        if(confirm("Supprimer toutes les données de cette journée?")) {
            let vide = {}; sections.forEach(s => vide[s] = []);
            await set(ref(db, `registres/${jourActuel}`), vide);
            allData[jourActuel] = vide; sectionBloquee = ""; afficher(); alert("✅ Journée réinitialisée");
        }
    }

    window.imprimerSection = function() {
        let section = prompt("Quelle section imprimer?");
        if(!section) return;
        section = section.toUpperCase();
        let agentsDeLaSection = allData[jourActuel][section] || [];
        if(agentsDeLaSection.length === 0) { alert("Aucun agent trouvé"); return; }
        let htmlImpression = `<h1>LISTE CANTINE - ${section}</h1><table border="1" style="width:100%;"><tr><th>N°</th><th>CODE</th><th>STATUT</th></tr>`;
        agentsDeLaSection.forEach((a, index) => {
            let statut = a.mange? "A MANGÉ" : "PRÉSENT";
            htmlImpression += `<tr><td>${index + 1}</td><td>${a.code}</td><td>${statut}</td></tr>`;
        });
        htmlImpression += `</table>`;
        let f = window.open('', '', 'height=700,width=900');
        f.document.write(htmlImpression); f.document.close(); f.print();
    }

    window.toggleCache = function() {
        if(!cacheActif) {
            cacheActif = true; document.getElementById('btnCache').innerText = "🔒 Afficher Codes";
        } else {
            let code = prompt("Tapez le Code pour AFFICHER:");
            if(code!== CODE_VOIR) { alert("❌ Code incorrect!"); return; }
            cacheActif = false; document.getElementById('btnCache').innerText = "👁️ Cacher Codes";
        }
        afficher();
    }

    window.deconnexion = function() {
        document.getElementById('pagePrincipale').classList.add('cacher');
        document.getElementById('pageLogin').classList.remove('cacher');
        document.getElementById('codeAcces').value = '';
    }
</script>
</body>
</html>
