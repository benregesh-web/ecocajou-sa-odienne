<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Registre de Pointage</title>
<link rel="stylesheet" href="style.css">
<style>
   
</style>
</head>
<body>

<div id="pageLogin" class="bloc">
    <h2>Connexion</h2>
    <input type="password" id="codeAcces" placeholder="Tapez le code d'accès">
    <button onclick="verifierAcces()" style="background:#007bff;">Entrer</button>
    <p id="msgErreur" style="color:red;"></p>
</div>

<div id="pagePrincipale" class="cacher">
    <div class="bloc">
        <button onclick="deconnexion()" style="background:red; float:right;">Déconnexion</button>
        <h2>Gestion du Jour</h2>
        <label>Choisir Date: </label>
        <input type="date" id="selectDate">
        <button onclick="chargerJour()" style="background:#17a2b8;">Charger ce jour</button>
        <button onclick="nouveauJour()" style="background:#007bff;">+ Nouveau Jour Aujourd'hui</button>
        <button onclick="window.print()" style="background:#ffc107; color:#000;">🖨️ Imprimer</button>
        <button onclick="resetJour()" style="background:#dc3545;">🗑️ Tout Réinitialiser</button>
        <button onclick="toggleCache()" id="btnCache" style="background:#6c757d;">👁️ Cacher Codes</button>
    </div>

    <div class="bloc">
        <h2>Ajouter un Code</h2>
        <input type="text" id="codeAjout" placeholder="Code Agent">
        <select id="sectionAjout"></select>
        <button onclick="ajouterCode()" style="background:#28a745;">Ajouter</button>
        <p id="msgAjout"></p>
    </div>

    <div class="bloc">
        <h2>Vérifier un Code</h2>
        <input type="text" id="codeVerif" placeholder="Code Agent">
        <button onclick="verifierCode()" style="background:#17a2b8;">Vérifier</button>
        <p id="msgVerif"></p>
    </div>

    <h2>Sections du <span id="titreDate"></span></h2>
    <div id="conteneurSections"></div>
    <div id="totalGeneral">TOTAL GENERAL : 0</div>
</div>

<script>
// 1. CODES SECRETS
const CODE_SECRET = "BEN2026"; // Code pour entrer
const CODE_RESET = "RESET2026"; // Code pour effacer la journée
const CODE_VOIR = "VOIR2026"; // Code pour afficher les codes cachés
let cacheActif = false; // Pour savoir si on cache

// 2. TES SECTIONS
const sections = [
"SECTION MAGASIN NOIX BRUTE",
"SECTION QUALITE NOIX BRUTE",
"SECTION CALLIBRAGE",
"SECTION CALLIBRAGE CARISTE",
"SECTION CHAUDIERE",
"SECTION COQUE",
"SECTION COQUE CHAUFFEUR",
"SECTION CUISSON",
"SECTION CUISSON CARISTE",
"SECTION DECO HOMME",
"SECTION DECO FEMME",
"SECTION QUALITE DECO",
"SECTION ENTRETIEN DECO",
"SECTION SCOOPING",
"SECTION SCOOPING CORRECTION",
"SECTION ETUVAGE",
"SECTION GESTIONNAIRE/MAGASIN PIECES DE RECHANGE",
"SECTION MAINTENANCE",
"SECTION CONTROLEUR FOUR",
"SECTION BP AUTO",
"SECTION CONCASSAGE",
"SECTION CLASS MANUEL",
"SECTION CLASS AUTO",
"SECTION EMBALLAGE 1",
"SECTION EMBALLAGE 2", "SECTION ENTRETIEN EMBALLAGE",
"SECTION MAGASIN PRODUIT FINIS",
"SECTION DPM GROS SALLE",
"SECTION DPM CORRECTRISES",
"SECTION ENTRETIEN DPM",
"SECTION ENTRETIEN ZONE BLANCHE",
"SECTION ENTRETIEN ADMINISTRATION",
"SECTION OPERATEUR PESEE", "SECTION HYGIENE",
"SECTION BLANDERIE", "SECTION ENTRETIEN",
"SECTION ENTRETIEN ZONE NON BATI",
"SECTION CANTINE", "SECTION DISTRI.PROD MAN",
"ADMINISTRATION",
"ELEVES"
];

let allData = JSON.parse(localStorage.getItem('registresPointage')) || {};
let jourActuel = new Date().toISOString().split('T')[0];

// FONCTIONS PRINCIPALES
function verifierAcces() {
    let code = document.getElementById('codeAcces').value;
    if(code === CODE_SECRET) {
        document.getElementById('pageLogin').classList.add('cacher');
        document.getElementById('pagePrincipale').classList.remove('cacher');
        document.getElementById('selectDate').value = jourActuel;
        nouveauJour();
    } else {
        document.getElementById('msgErreur').innerText = "Code incorrect!";
    }
}

function nouveauJour() {
    if(!allData[jourActuel]) {
        allData[jourActuel] = {};
        sections.forEach(s => allData[jourActuel][s] = []);
        sauvegarder();
    }
    afficher();
}

function chargerJour() {
    jourActuel = document.getElementById('selectDate').value;
    afficher();
}

function sauvegarder() {
    localStorage.setItem('registresPointage', JSON.stringify(allData));
}

function afficher() {
    document.getElementById('titreDate').innerText = jourActuel;
    let selectHTML = '';
    sections.forEach(s => selectHTML += `<option value="${s}">${s}</option>`);
    document.getElementById('sectionAjout').innerHTML = selectHTML;

    let html = '';
    let totalGeneral = 0;
    let dataJour = allData[jourActuel] || {};

    sections.forEach(section => {
        let agents = dataJour[section] || [];
        totalGeneral += agents.length;

        let liste = agents.map(a => {
            let codeAffiche = cacheActif? "*****" : a.code;
            return `<li>${codeAffiche} <span class="${a.mange? 'mange' : 'present'}">${a.mange? '🍽️ MANGÉ' : '✅ PRÉSENT'}</span> <button onclick="supprimerCode('${section}', '${a.code}')" style="background:red; color:white; border:none; padding:2px 6px; margin-left:5px; border-radius:3px; font-size:11px;">X</button></li>`
        }).join('');

        html += `
            <div class="section-bloc">
                <h3>${section} <span style="font-size:12px;">(${agents.length})</span></h3>
                <ul>${liste}</ul>
            </div>
        `;
    });

    document.getElementById('conteneurSections').innerHTML = html;
    document.getElementById('totalGeneral').innerText = `TOTAL GENERAL : ${totalGeneral}`;
}

function ajouterCode() {
    let code = document.getElementById('codeAjout').value.trim().toUpperCase();
    let section = document.getElementById('sectionAjout').value;
    if(!code) return alert("Tapez un code");

    // Vérifier dans TOUTES les sections du jour
    let dejaExiste = false;
    let sectionTrouvee = '';
    for(let s in allData[jourActuel]) {
        if(allData[jourActuel][s].find(a => a.code === code)) {
            dejaExiste = true;
            sectionTrouvee = s;
            break;
        }
    }

    if(dejaExiste) {
        document.getElementById('msgAjout').innerHTML = `<span style="color:red;">❌ ERREUR : Le code ${code} existe déjà dans ${sectionTrouvee}</span>`;
        return;
    }

    allData[jourActuel][section].push({code: code, mange: false});
    sauvegarder();
    document.getElementById('msgAjout').innerHTML = `<span style="color:green;">✅ Code ${code} ajouté à ${section}</span>`;
    document.getElementById('codeAjout').value = '';
    afficher();
}

function verifierCode() {
    let code = document.getElementById('codeVerif').value.trim().toUpperCase();
    if(!code) return alert("Tapez un code");

    let trouve = false;
    for(let s in allData[jourActuel]) {
        let agent = allData[jourActuel][s].find(a => a.code === code);
        if(agent) {
            trouve = true;

            // 1ERE FOIS : il n'a pas encore mangé
            if(agent.mange === false) {
                agent.mange = true; // On le coche
                document.getElementById('msgVerif').innerHTML =
                `<span style="color:green;">
                    <b>${code}</b> trouvé dans <b>${s}</b><br>
                    ✅ STATUT: PRÉSENT<br>
                    🍽️ IL A DROIT A 1 PLAT<br>
                    <b>Validez et donnez lui son plat</b>
                </span>`;

            // 2EME FOIS ET PLUS : il a déjà mangé
            } else {
                document.getElementById('msgVerif').innerHTML =
                `<span style="color:red;">
                    <b>${code}</b> trouvé dans <b>${s}</b><br>
                    ❌ STATUT: A DÉJÀ PRIS SON PLAT<br>
                    <b>IL N'A PLUS DROIT A UN AUTRE PLAT AUJOURD'HUI</b>
                </span>`;
            }

            sauvegarder();
            afficher();
            break;
        }
    }
    if(!trouve) document.getElementById('msgVerif').innerHTML = `<span style="color:red;">❌ Code ${code} non trouvé aujourd'hui</span>`;
}

// FONCTION SUPPRIMER AVEC CODE CACHÉ
function supprimerCode(section, code) {
    let div = document.createElement('div');
    div.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;";
    div.innerHTML = `
        <div style="background:white;padding:20px;border-radius:8px;text-align:center;">
            <p><b>Tapez le Code Admin pour supprimer</b></p>
            <input type="password" id="inputAdmin" style="padding:8px; width:200px;">
            <br><br>
            <button onclick="validerSuppr('${section}', '${code}')" style="background:#dc3545;">OK</button>
            <button onclick="document.body.removeChild(this.parentNode.parentNode)" style="background:#6c757d;">Annuler</button>
        </div>
    `;
    document.body.appendChild(div);
}

function validerSuppr(section, code) {
    let codeAdmin = document.getElementById('inputAdmin').value;
    document.body.removeChild(document.body.lastChild);

    if(codeAdmin!== CODE_SECRET) {
        alert("❌ Code Admin incorrect!");
        return;
    }

    if(confirm(`Supprimer le code ${code} de ${section}?`)) {
        allData[jourActuel][section] = allData[jourActuel][section].filter(a => a.code!== code);
        sauvegarder();
        afficher();
        alert(`Code ${code} supprimé ✅`);
    }
}

// FONCTION RESET JOURNEE
function resetJour() {
    let code = prompt("⚠️ ATTENTION! Ce code va tout effacer pour aujourd'hui.\nTapez le Code RESET:");
    if(code!== CODE_RESET) {
        alert("❌ Code incorrect!");
        return;
    }
    if(confirm("Voulez-vous vraiment supprimer toutes les données de cette journée?")) {
        allData[jourActuel] = {};
        sections.forEach(s => allData[jourActuel][s] = []);
        sauvegarder();
        afficher();
        alert("✅ Journée réinitialisée à zéro");
    }
}

// FONCTION CACHER/AFFICHER
function toggleCache() {
    if(!cacheActif) { // Si on veut cacher
        cacheActif = true;
        document.getElementById('btnCache').innerText = "🔒 Afficher Codes";
        document.getElementById('btnCache').style.background = "#28a745";
    } else { // Si on veut afficher
        let code = prompt("Tapez le Code pour AFFICHER les codes:");
        if(code!== CODE_VOIR) {
            alert("❌ Code incorrect!");
            return;
        }
        cacheActif = false;
        document.getElementById('btnCache').innerText = "👁️ Cacher Codes";
        document.getElementById('btnCache').style.background = "#6c757d";
    }
    afficher(); // Recharge la page
}

function deconnexion() {
    document.getElementById('pagePrincipale').classList.add('cacher');
    document.getElementById('pageLogin').classList.remove('cacher');
    document.getElementById('codeAcces').value = '';
}
</script>
</body>
</html>
